openapi: 3.1.0
info:
  title: Fleetline Authentication API
  version: 1.0.0
servers:
  - url: http://localhost:3000
paths:
  /api/auth/register:
    post:
      summary: Register an admin account
      responses: { "201": { description: Registered }, "409": { description: Duplicate email }, "422": { description: Invalid input } }
  /api/auth/login:
    post:
      summary: Authenticate with email and password
      responses: { "200": { description: Authenticated and refresh cookie set }, "401": { description: Invalid credentials }, "403": { description: Inactive account } }
  /api/auth/refresh-token:
    post:
      summary: Rotate refresh session
      responses: { "200": { description: Access token issued }, "401": { description: Invalid, expired, revoked, or reused session } }
  /api/auth/logout:
    post:
      summary: Revoke refresh session and clear cookie
      responses: { "200": { description: Logged out } }
  /api/auth/forgot-password:
    post:
      summary: Request a password reset
      responses: { "200": { description: Generic response regardless of account existence }, "429": { description: Rate limited } }
  /api/auth/verify-reset-token:
    post:
      summary: Verify an unused reset token
      responses: { "200": { description: Valid }, "400": { description: Invalid or expired } }
  /api/auth/reset-password:
    post:
      summary: Consume reset token and revoke sessions
      responses: { "200": { description: Password reset }, "400": { description: Invalid, expired, or used token } }
  /api/auth/change-password:
    post:
      summary: Change current user's password
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: Password changed and sessions revoked }, "401": { description: Unauthenticated } }
  /api/auth/me:
    get:
      summary: Get current user
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: Safe user profile }, "401": { description: Unauthenticated } }
    put:
      summary: Update current user's name and phone
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: Updated }, "422": { description: Invalid input } }
  /api/auth/me/profile-image:
    post:
      summary: Upload JPEG, PNG, or WebP profile image up to 5 MB
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: Image replaced }, "413": { description: Too large }, "422": { description: Invalid image } }
    delete:
      summary: Delete profile image
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: Image deleted } }
  /api/admin/users:
    get:
      summary: List users
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: Users }, "403": { description: SUPER_ADMIN required } }
    post:
      summary: Create user
      security: [{ bearerAuth: [] }]
      responses: { "201": { description: User created }, "403": { description: SUPER_ADMIN required } }
  /api/admin/users/{id}:
    put:
      summary: Update user role, status, and profile
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: Updated }, "403": { description: SUPER_ADMIN required } }
    delete:
      summary: Delete user
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: Deleted }, "403": { description: SUPER_ADMIN required } }
  /api/vehicles/images:
    post:
      summary: Upload a JPEG, PNG, or WebP vehicle image
      security: [{ bearerAuth: [] }]
      responses: { "201": { description: Image URL created }, "413": { description: Too large }, "422": { description: Invalid image } }
  /api/bikes:
    get:
      summary: List bikes
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: Bikes } }
    post:
      summary: Create a bike
      security: [{ bearerAuth: [] }]
      responses: { "201": { description: Bike created }, "422": { description: Invalid input } }
  /api/bikes/{id}:
    get:
      summary: Get a bike
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: Bike }, "404": { description: Not found } }
    put:
      summary: Update a bike
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: Bike updated }, "404": { description: Not found } }
    delete:
      summary: Delete a bike
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: Bike deleted }, "404": { description: Not found } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
