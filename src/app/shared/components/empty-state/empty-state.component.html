<div class="empty-state">
  <div class="empty-illustration"><app-icon name="search" /></div>
  <h3>{{ title() }}</h3>
  <p>{{ description() }}</p>
  @if (actionLabel()) {
    <button class="button secondary" (click)="action.emit()">
      <app-icon name="add" />{{ actionLabel() }}
    </button>
  }
</div>
