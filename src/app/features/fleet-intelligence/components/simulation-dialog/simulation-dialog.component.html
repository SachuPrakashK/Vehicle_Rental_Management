<div class="modal-overlay" (click)="closeRequested.emit()">
  <section
    class="modal compact-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="simulation-title"
    (click)="$event.stopPropagation()"
  >
    <div class="modal-header">
      <div>
        <h2 id="simulation-title">Add simulated position</h2>
        <p>Development and demonstration only</p>
      </div>
      <button class="icon-button" type="button" aria-label="Close" (click)="closeRequested.emit()">
        <app-icon name="close"></app-icon>
      </button>
    </div>
    <form class="modal-body fleet-form" [formGroup]="form()" (ngSubmit)="saveRequested.emit()">
      <div class="simulation-banner full">
        <strong>SIMULATED LOCATION</strong
        ><span>This will never be presented as live GPS data.</span>
      </div>
      <label class="field full"
        ><span>Vehicle <b>*</b></span
        ><select formControlName="vehicleId">
          <option value="">Select vehicle</option>
          @for (vehicle of vehicles(); track vehicle.carId) {
            <option [value]="vehicle.carId">
              {{ vehicle.regNo }} · {{ vehicle.brand }} {{ vehicle.model }}
            </option>
          }
        </select></label
      ><label class="field"
        ><span>Latitude <b>*</b></span
        ><input type="number" step="0.000001" formControlName="latitude" /></label
      ><label class="field"
        ><span>Longitude <b>*</b></span
        ><input type="number" step="0.000001" formControlName="longitude" /></label
      ><label class="field full"
        ><span>Speed (km/h)</span><input type="number" formControlName="speed"
      /></label>
      <div class="modal-actions full">
        <button class="button secondary" type="button" (click)="closeRequested.emit()">
          Cancel</button
        ><button class="button primary" type="submit" [disabled]="form().invalid || saving()">
          {{ saving() ? 'Adding...' : 'Add simulated position' }}
        </button>
      </div>
    </form>
  </section>
</div>
