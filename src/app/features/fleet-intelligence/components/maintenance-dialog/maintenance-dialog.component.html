<div class="drawer-overlay" (click)="closeRequested.emit()">
  <aside
    class="drawer"
    role="dialog"
    aria-modal="true"
    aria-labelledby="maintenance-title"
    (click)="$event.stopPropagation()"
  >
    <div class="drawer-header">
      <div>
        <h2 id="maintenance-title">Add Maintenance</h2>
        <p>Schedule and manage vehicle maintenance activities.</p>
      </div>
      <button class="icon-button" type="button" aria-label="Close" (click)="closeRequested.emit()">
        <app-icon name="close"></app-icon>
      </button>
    </div>
    <form class="fleet-drawer-form" [formGroup]="form()" (ngSubmit)="saveRequested.emit()">
      <div class="drawer-content fleet-form">
        <div class="fleet-form-section full">
          <app-icon name="wrench"></app-icon>
          <div>
            <h3>Service details</h3>
            <p>Choose the vehicle and describe the required work.</p>
          </div>
        </div>
        <label class="field"
          ><span>Vehicle <b>*</b></span
          ><select formControlName="vehicleId">
            <option value="">Select vehicle</option>
            @for (vehicle of vehicles(); track vehicle.carId) {
              <option [value]="vehicle.carId">
                {{ vehicle.regNo }} · {{ vehicle.brand }} {{ vehicle.model }}
              </option>
            }
          </select>
          @if (form().get('vehicleId')?.touched && form().get('vehicleId')?.invalid) {
            <small class="field-error">Select a vehicle.</small>
          }
        </label>
        <label class="field"
          ><span>Maintenance type <b>*</b></span
          ><input formControlName="maintenanceType" placeholder="Enter maintenance type" />
          @if (form().get('maintenanceType')?.touched && form().get('maintenanceType')?.invalid) {
            <small class="field-error">Enter the maintenance type.</small>
          }
        </label>
        <label class="field full"
          ><span>Description <b>*</b></span
          ><textarea
            formControlName="description"
            placeholder="Enter service requirements"
          ></textarea>
          @if (form().get('description')?.touched && form().get('description')?.invalid) {
            <small class="field-error">Enter a short description of the required service.</small>
          }
        </label>
        <label class="field"
          ><span>Scheduled date <b>*</b></span
          ><input type="date" formControlName="scheduledDate" />
          @if (form().get('scheduledDate')?.touched && form().get('scheduledDate')?.invalid) {
            <small class="field-error">Select a scheduled date.</small>
          }
        </label>
        <label class="field"
          ><span>Odometer reading <b>*</b></span>
          <div class="input-suffix">
            <input
              type="number"
              formControlName="odometerReading"
              placeholder="Enter odometer reading"
            /><span>km</span>
          </div>
          @if (form().get('odometerReading')?.touched && form().get('odometerReading')?.invalid) {
            <small class="field-error">Enter a valid odometer reading.</small>
          }
        </label>
        <div class="fleet-form-section full">
          <app-icon name="money"></app-icon>
          <div>
            <h3>Cost and provider</h3>
            <p>Add optional planning information for this service.</p>
          </div>
        </div>
        <label class="field"
          ><span>Estimated cost</span>
          <div class="input-prefix">
            <span>₹</span
            ><input
              type="number"
              formControlName="estimatedCost"
              placeholder="Enter estimated cost"
            /></div
        ></label>
        <label class="field"
          ><span>Service provider</span
          ><input formControlName="serviceProvider" placeholder="Enter service provider"
        /></label>
      </div>
      <div class="drawer-footer">
        <button class="button secondary" type="button" (click)="closeRequested.emit()">
          Cancel</button
        ><button class="button primary" type="submit" [disabled]="form().invalid || saving()">
          {{ saving() ? 'Adding...' : 'Add Maintenance' }}
        </button>
      </div>
    </form>
  </aside>
</div>
