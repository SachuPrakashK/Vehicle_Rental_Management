<div class="modal-overlay" (click)="closeRequested.emit()">
  <section
    class="modal compact-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="geofence-title"
    (click)="$event.stopPropagation()"
  >
    <div class="modal-header">
      <div>
        <h2 id="geofence-title">{{ editing() ? 'Edit Geofence' : 'Add Geofence' }}</h2>
        <p>
          {{
            editing()
              ? 'Update this circular operational boundary'
              : 'Create a circular operational boundary'
          }}
        </p>
      </div>
      <button class="icon-button" type="button" aria-label="Close" (click)="closeRequested.emit()">
        <app-icon name="close"></app-icon>
      </button>
    </div>
    <form class="modal-body fleet-form" [formGroup]="form()" (ngSubmit)="saveRequested.emit()">
      <label class="field full"
        ><span>Name <b>*</b></span
        ><input formControlName="name" placeholder="Enter geofence name" /></label
      ><label class="field full"
        ><span>Description</span
        ><input formControlName="description" placeholder="Enter boundary purpose" /></label
      ><label class="field"
        ><span>Centre latitude <b>*</b></span
        ><input type="number" step="0.000001" formControlName="centerLatitude" /></label
      ><label class="field"
        ><span>Centre longitude <b>*</b></span
        ><input type="number" step="0.000001" formControlName="centerLongitude" /></label
      ><label class="field full"
        ><span>Radius in metres <b>*</b></span
        ><input type="number" formControlName="radiusMeters" /></label
      ><label class="field full"
        ><span>Status <b>*</b></span
        ><select formControlName="status">
          <option value="ACTIVE">Active</option>
          <option value="INACTIVE">Inactive</option>
        </select></label
      >
      <div class="modal-actions full">
        <button class="button secondary" type="button" (click)="closeRequested.emit()">
          Cancel</button
        ><button class="button primary" type="submit" [disabled]="form().invalid || saving()">
          {{ saving() ? 'Saving...' : editing() ? 'Update Geofence' : 'Add Geofence' }}
        </button>
      </div>
    </form>
  </section>
</div>
