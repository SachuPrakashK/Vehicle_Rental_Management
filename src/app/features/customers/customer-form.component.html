<form [formGroup]="form" (ngSubmit)="save()" novalidate>
  <div class="form-grid">
    <div class="field span-2">
      <label for="customer-name">Full name <span class="required">*</span></label
      ><input
        id="customer-name"
        formControlName="customerName"
        autocomplete="name"
        placeholder="Enter full name"
      /><app-field-error [control]="form.controls.customerName" />
    </div>
    <div class="field span-2">
      <label for="customer-email"
        >Email address
        @if (booking()) {
          <span class="required">*</span>
        }</label
      ><input
        id="customer-email"
        type="email"
        formControlName="email"
        autocomplete="email"
        placeholder="Enter email address"
      /><app-field-error [control]="form.controls.email" />
    </div>
    <div class="field">
      <label for="customer-mobile">Mobile number</label
      ><input
        id="customer-mobile"
        type="tel"
        formControlName="mobileNo"
        autocomplete="tel-national"
        maxlength="10"
        placeholder="Enter phone number"
      /><app-field-error [control]="form.controls.mobileNo" />
    </div>
    <div class="field">
      <label for="customer-city">City</label
      ><input
        id="customer-city"
        formControlName="customerCity"
        autocomplete="address-level2"
        placeholder="Enter city"
      /><app-field-error [control]="form.controls.customerCity" />
    </div>
  </div>
  <p class="form-note">
    Use accurate contact information to identify this customer in future bookings.
  </p>
  <div class="form-actions">
    <button class="button" type="submit" [disabled]="form.invalid || busy()">
      @if (busy()) {
        <span class="spinner"></span>
      }
      {{ customer() ? 'Save changes' : booking() ? 'Save & select customer' : 'Create customer' }}
    </button>
  </div>
</form>
