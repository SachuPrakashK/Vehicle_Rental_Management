<app-auth-layout
  title="Set a new password"
  description="Choose a strong password to protect your account."
>
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <app-password-field
      [control]="form.controls.password"
      inputId="auth-password"
      label="New password"
      placeholder="Enter new password"
      autocomplete="new-password"
    />
    <app-password-field
      [control]="form.controls.confirmPassword"
      inputId="auth-confirm"
      label="Confirm password"
      placeholder="Re-enter password"
      autocomplete="new-password"
    />
    @if (form.hasError('passwordMismatch') && form.controls.confirmPassword.touched) {
      <small class="field-error">Passwords must match.</small>
    }
    <p class="form-note">
      Use 8+ characters with uppercase, lowercase, number, and special character.
    </p>
    <div class="field">
      <label for="auth-token">Reset token <span class="required">*</span></label>
      <input
        id="auth-token"
        formControlName="token"
        autocomplete="off"
        placeholder="Enter reset token"
      />
      <app-field-error [control]="form.controls.token" />
    </div>
    @if (error()) {
      <div class="field-error" role="alert">{{ error() }}</div>
    }
    <button
      type="submit"
      class="button full"
      [disabled]="form.invalid || busy()"
      aria-label="Reset password"
    >
      @if (busy()) {
        <span class="spinner"></span>
      }
      Reset password <app-icon name="arrow" />
    </button>
  </form>
  <div class="auth-links"><a routerLink="/auth/login">Back to sign in</a></div>
</app-auth-layout>
