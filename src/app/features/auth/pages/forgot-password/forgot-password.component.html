<app-auth-layout
  title="Forgot your password?"
  description="Enter your email to request a password reset link."
>
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="field">
      <label for="auth-email">Email address <span class="required">*</span></label>
      <input
        id="auth-email"
        formControlName="email"
        type="email"
        autocomplete="email"
        placeholder="Enter email address"
      />
      <app-field-error [control]="form.controls.email" />
    </div>
    @if (error()) {
      <div class="field-error" role="alert">{{ error() }}</div>
    }
    <button
      type="submit"
      class="button full"
      [disabled]="form.invalid || busy()"
      aria-label="Send reset link"
    >
      @if (busy()) {
        <span class="spinner"></span>
      }
      Send reset link <app-icon name="arrow" />
    </button>
  </form>
  <div class="auth-links"><a routerLink="/auth/login">Back to sign in</a></div>
</app-auth-layout>
