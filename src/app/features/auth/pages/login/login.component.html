<app-auth-layout
  title="Welcome back"
  description="Your fleet, customers, and bookings. All in one place."
>
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="field">
      <label for="auth-email">Email address <span class="required">*</span></label>
      <input
        id="auth-email"
        formControlName="email"
        type="email"
        autocomplete="email"
        placeholder="Enter email address"
      />
      <app-field-error [control]="form.controls.email" />
    </div>
    <app-password-field
      [control]="form.controls.password"
      inputId="auth-password"
      label="Password"
      placeholder="Enter password"
    />
    <div class="row space-between">
      <span></span><a routerLink="/auth/forgot-password" class="text-link">Forgot password?</a>
    </div>
    @if (error()) {
      <div class="field-error" role="alert">{{ error() }}</div>
    }
    <button
      type="submit"
      class="button full"
      [disabled]="form.invalid || busy()"
      aria-label="Sign in"
    >
      @if (busy()) {
        <span class="spinner"></span>
      }
      Sign in <app-icon name="arrow" />
    </button>
  </form>
  <div class="auth-links">
    New to Fleetline? <a routerLink="/auth/register">Create an account</a>
  </div>
</app-auth-layout>
